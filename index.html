<style>
  :root {
    --paper: #eceee0;
    --paper-deep: #e2e4d2;

  html, body {

  }

    outline: 2px solid var(--fairway-bright);

  }

  /* ---------- shell ---------- */
  #app { min-height: 100%; display: flex; flex-direction: column; }

    top: 0;
    top: env(safe-area-inset-top, 0px);

    justify-content: space-between;

    border-bottom: 3px solid var(--gold);

  header.top .brand { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
  header.top .brand .mark {

  .headerRight { display: flex; align-items: center; gap: 14px; }

<div id="app">
  <header class="top">
    <div class="brand" onclick="location.hash='#/'">
      <span class="flagpole">⛳</span>
      <span class="mark">Fairway Ledger</span>
    </div>
    <div class="headerRight">
      <nav class="crumbs" id="crumbs"></nav>
      <span id="authArea"></span>
    </div>
  </header>
  <main id="main">
    <p class="tag">Loading the clubhouse…</p>
  </main>
  <footer class="foot">
    <span class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting…</span></span>
  </footer>

<script>
/* ======================= Data layer (Firebase) ======================= */
let db = null;
let auth = null;
let dbState = "connecting"; // connecting | live | unavailable | badconfig
let isOwner = false; // true once the site owner signs in; controls whether edit UI is shown
const store = { players: [], trips: [], roundsByTrip: {} };
const unsubs = { players: null, trips: null, rounds: {} };
const DEFAULT_PAR = [4,4,3,4,5,4,3,4,5, 4,4,3,4,5,4,3,4,5]; // 18 holes, par 72

/* ======================= Course lookup (OpenGolfAPI) =======================
   Free, keyless, public golf course database: search by name, then pull
   per-hole par and tee ratings/slopes for the selected tee. No account or
   API key needed — this is a courtesy of opengolfapi.org's open dataset. */
const OGA_BASE = "https://api.opengolfapi.org/v1";

async function ogaSearchCourses(query) {
  const res = await fetch(`${OGA_BASE}/courses/search?q=${encodeURIComponent(query)}&limit=8`);
  if (!res.ok) throw new Error("search failed");
  const data = await res.json();
  return data.courses || [];
}

async function ogaGetCourseDetail(id) {
  const res = await fetch(`${OGA_BASE}/courses/${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error("detail failed");
  return await res.json();
}

// Field names in this community-maintained dataset vary a bit course to
// course, so read defensively with fallbacks rather than assuming one shape.
function ogaNormalizeHole(h) {
  const num = h.number ?? h.hole ?? h.hole_number ?? h.num;
  const par = h.par;
  return { number: Number(num) || null, par: Number(par) || null };
}
function ogaNormalizeTee(t) {
  const holes = Array.isArray(t.holes) ? t.holes.map(ogaNormalizeHole) : [];
  return {
    name: t.tee_name || t.name || "Tee",
    gender: t.gender || "",
    rating: t.course_rating ?? t.rating ?? null,
    slope: t.slope_rating ?? t.slope ?? null,
    parTotal: t.par_total ?? t.par ?? null,
    yards: t.total_yards ?? t.yardage ?? null,
    holes,
  };
}
// Flattens the detail response into a course-level 18-length par array
// (par doesn't vary by tee, only yardage does) using whichever field the
// response actually provided.
function ogaCoursePars(detail) {
  const rawHoles = Array.isArray(detail.holes) ? detail.holes
    : Array.isArray(detail.scorecard) ? detail.scorecard
    : [];
  if (!rawHoles.length) return null;
  const normalized = rawHoles.map(ogaNormalizeHole).filter(h => h.number && h.par);
  if (normalized.length < 18) return null;
  const pars = new Array(18).fill(null);
  normalized.forEach(h => { if (h.number >= 1 && h.number <= 18) pars[h.number - 1] = h.par; });
  return pars.every(p => p) ? pars : null;
}

function setStatus(state, text) {
  dbState = state;

  document.getElementById('statusDot').classList.toggle('live', state === 'live');
}

function initDb() {
  const cfg = window.__FIREBASE_CONFIG__ || {};
  if (!cfg.apiKey || cfg.apiKey === "PASTE_ME") {
    setStatus("badconfig", "Firebase isn't configured yet — see SETUP.md");
    render();
    return;
  }
  try {
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    auth = firebase.auth();
  } catch (e) {
    setStatus("unavailable", "Couldn't connect — check your Firebase config");
    render();
    return;
  }

  auth.onAuthStateChanged(user => {
    isOwner = !!user;
    renderAuthArea();
    render();
  });

  setStatus("live", "Connected — viewing live");

  unsubs.players = db.collection("players").orderBy("name").onSnapshot(
    snap => { store.players = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => setStatus("unavailable", "Roster sync interrupted")
  );

  unsubs.trips = db.collection("trips").orderBy("createdAt", "desc").onSnapshot(
    snap => {
      store.trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      store.trips.forEach(t => watchRounds(t.id));
      render();
    },
    err => setStatus("unavailable", "Trip sync interrupted")
  );
}

function watchRounds(tripId) {
  if (unsubs.rounds[tripId]) return;
  unsubs.rounds[tripId] = db.collection(`trips/${tripId}/rounds`).orderBy("date", "desc").onSnapshot(
    snap => {
      store.roundsByTrip[tripId] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    },
    err => {}
  );
}

/* ======================= Helpers ======================= */
function uid() { return Math.random().toString(36).slice(2, 10); }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtRange(a, b) {
  if (!a && !b) return "";
  if (a && b && a !== b) return `${fmtDate(a)} – ${fmtDate(b)}`;
  return fmtDate(a || b);
}
function toParLabel(n) {
  if (n === 0) return "E";
  return n > 0 ? `+${n}` : `${n}`;
}
function toParClass(n) {
  return n < 0 ? "topar-under" : n > 0 ? "topar-over" : "topar-even";
}
function sumHoles(arr, from, to) {
  let s = 0;
  for (let i = from; i < to; i++) s += (Number(arr[i]) || 0);
  return s;
}
function playerName(id) {
  const p = store.players.find(p => p.id === id);
  return p ? p.name : "Unknown";
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
/* Safe to drop inside onclick="...('${jsAttr(x)}')" — escapes for the JS
   single-quoted string literal first, then for the HTML double-quoted attribute. */
function jsAttr(s) {
  return String(s ?? "")
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;');
}

/* Aggregate a trip's rounds into per-player totals */
/* Shared aggregation for both the trip-wide and per-course leaderboards.
   Net-to-par uses each player's trip handicap: when a round has tee
   rating/slope on file, a real course handicap is computed (WHS formula);
   otherwise the raw handicap index is used as a simple stroke allowance. */
function buildLeaderboard(rounds, trip) {
  const roster = (trip && trip.roster) || {};
  const agg = {};
  rounds.forEach(r => {
    const par = r.par || DEFAULT_PAR;
    const parTotal = sumHoles(par, 0, 18);
    Object.entries(r.scores || {}).forEach(([pid, holes]) => {
      const played = holes.filter(h => Number(h) > 0).length;
      if (played === 0) return;
      const total = sumHoles(holes, 0, 18);
      if (!agg[pid]) agg[pid] = { rounds: 0, strokes: 0, parSum: 0, best: null, netToParSum: 0, hasHandicap: false };
      agg[pid].rounds += 1;
      agg[pid].strokes += total;
      agg[pid].parSum += parTotal;
      if (agg[pid].best === null || total < agg[pid].best) agg[pid].best = total;

      const hcpStr = roster[pid];
      const hi = hcpStr ? parseFloat(hcpStr) : NaN;
      if (hcpStr && !isNaN(hi)) {
        const courseHcp = (r.courseRating && r.slopeRating)
          ? Math.round(hi * (Number(r.slopeRating) / 113) + (Number(r.courseRating) - parTotal))
          : Math.round(hi);
        agg[pid].netToParSum += (total - parTotal) - courseHcp;
        agg[pid].hasHandicap = true;
      }
    });
  });
  return Object.entries(agg)
    .map(([pid, a]) => ({
      pid, ...a,
      toPar: a.strokes - a.parSum,
      netToPar: a.hasHandicap ? a.netToParSum : null,
    }))
    .sort((x, y) => x.toPar - y.toPar);
}

function tripLeaderboard(tripId) {
  const trip = store.trips.find(t => t.id === tripId);
  return buildLeaderboard(store.roundsByTrip[tripId] || [], trip);
}

/* Group a trip's rounds by course played, preserving most-recent-first order */
/* The trip's date range is derived from when its rounds were actually
   played, since trips no longer have manually-entered start/end dates. */
function tripDateRange(tripId) {
  const rounds = store.roundsByTrip[tripId] || [];
  const dates = rounds.map(r => r.date).filter(Boolean).sort();
  if (!dates.length) return '';
  return fmtRange(dates[0], dates[dates.length - 1]);
}

function tripCourses(tripId) {
  const rounds = store.roundsByTrip[tripId] || [];
  const trip = store.trips.find(t => t.id === tripId);
  const groups = [];
  const byKey = {};
  rounds.forEach(r => {
    const name = (r.course || (trip && trip.course) || 'Unspecified course').trim() || 'Unspecified course';
    const key = name.toLowerCase();
    if (!byKey[key]) {
      byKey[key] = { key, name, rounds: [] };
      groups.push(byKey[key]);
    }
    byKey[key].rounds.push(r);
  });
  return groups;
}

function courseLeaderboard(rounds, trip) {
  return buildLeaderboard(rounds, trip);
}

function careerStats() {
  const agg = {};
  store.trips.forEach(t => {
    const board = tripLeaderboard(t.id);
    board.forEach((row, idx) => {
      if (!agg[row.pid]) agg[row.pid] = { rounds: 0, strokes: 0, parSum: 0, best: null, wins: 0, trips: 0 };
      agg[row.pid].rounds += row.rounds;
      agg[row.pid].strokes += row.strokes;
      agg[row.pid].parSum += row.parSum;
      agg[row.pid].trips += 1;
      if (agg[row.pid].best === null || row.best < agg[row.pid].best) agg[row.pid].best = row.best;
      if (idx === 0) agg[row.pid].wins += 1;
    });
  });
  return Object.entries(agg)
    .map(([pid, a]) => ({ pid, ...a, toPar: a.strokes - a.parSum, avg: a.rounds ? (a.strokes / a.rounds) : 0 }))
    .sort((x, y) => x.toPar - y.toPar);
}

/* ======================= Routing ======================= */
window.addEventListener('hashchange', render);

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return parts;
}

/* ======================= Render ======================= */
function render() {
  const parts = route();
  const main = document.getElementById('main');
  const crumbs = document.getElementById('crumbs');
  crumbs.innerHTML = '';

  if (parts[0] === 'trip' && parts[1]) {
    renderTrip(parts[1], main, crumbs, parts[2], parts[3]);
  } else if (parts[0] === 'players') {
    crumbs.innerHTML = `<a href="#/">Home</a>`;
    renderPlayers(main);
  } else if (parts[0] === 'stats') {
    crumbs.innerHTML = `<a href="#/">Home</a>`;
    renderStats(main);
  } else if (parts[0] === 'courses') {
    crumbs.innerHTML = `<a href="#/">Home</a>`;
    renderAllCourses(main, parts[1]);
  } else {
    renderHome(main);
  }
}

function renderHome(main) {
  const trips = store.trips;
  let rows = trips.map(t => {
    const board = tripLeaderboard(t.id);
    const rounds = store.roundsByTrip[t.id] || [];
    const leader = board[0];
    return `
      <div class="ledger-row" onclick="location.hash='#/trip/${t.id}'">

          <div>${rounds.length} round${rounds.length === 1 ? '' : 's'}</div>

        </div>

}

function buildScorecardTable(r) {
  const par = r.par || DEFAULT_PAR;
  const entries = Object.entries(r.scores || {}).filter(([, h]) => h.some(x => Number(x) > 0));
  const parOut = sumHoles(par, 0, 9), parIn = sumHoles(par, 9, 18), parTotal = parOut + parIn;
  const front9 = (arr) => arr.slice(0, 9);
  const back9 = (arr) => arr.slice(9, 18);

  const headerRowHtml = `
    <tr>
      <th class="rowlabel">Hole</th>
      ${par.slice(0,9).map((p,i)=>`<th class="holecell">${i+1}</th>`).join('')}
      <th class="sum">OUT</th>
      ${par.slice(9,18).map((p,i)=>`<th class="holecell">${i+10}</th>`).join('')}
      <th class="sum">IN</th>
      <th class="sum">TOT</th>
    </tr>`;
  const parRowHtml = `
    <tr>
      <td class="rowlabel">Par</td>
      ${par.slice(0,9).map(p=>`<td class="holecell">${p}</td>`).join('')}
      <td class="sum">${parOut}</td>
      ${par.slice(9,18).map(p=>`<td class="holecell">${p}</td>`).join('')}
      <td class="sum">${parIn}</td>
      <td class="sum">${parTotal}</td>
    </tr>`;
  const bodyRowsHtml = entries.map(([pid, holes]) => {
    const out = sumHoles(holes, 0, 9), inn = sumHoles(holes, 9, 18), tot = out + inn;
    const cellsFront = front9(holes).map((h, i) => {
      const n = Number(h) || 0;
      const cls = n === 0 ? '' : (n < par[i] ? 'under' : n > par[i] ? 'over' : '');
      return `<td class="${cls}">${n || '–'}</td>`;
    }).join('');
    const cellsBack = back9(holes).map((h, i) => {
      const n = Number(h) || 0;
      const cls = n === 0 ? '' : (n < par[i+9] ? 'under' : n > par[i+9] ? 'over' : '');
      return `<td class="${cls}">${n || '–'}</td>`;
    }).join('');
    return `<tr>
      <td class="rowlabel">${escapeHtml(playerName(pid))}</td>
      ${cellsFront}
      <td class="sum">${out || '–'}</td>
      ${cellsBack}
      <td class="sum">${inn || '–'}</td>
      <td class="sum ${toParClass(tot - parTotal)}">${tot || '–'}</td>
    </tr>`;
  }).join('');

  return `<table class="scorecard">${headerRowHtml}${parRowHtml}${bodyRowsHtml}</table>`;
}

function renderRoundCard(tripId, r, isOpen) {
  const entries = Object.entries(r.scores || {}).filter(([, h]) => h.some(x => Number(x) > 0));
  const teeBits = [];
  if (r.teeName) teeBits.push(`${r.teeName} tees`);
  if (r.courseRating && r.slopeRating) teeBits.push(`${r.courseRating}/${r.slopeRating}`);
  return `
    <div class="round-card ${isOpen ? 'open' : ''}" id="round-${r.id}">
      <div class="rhead" onclick="toggleRound('${r.id}')">
        <div>
          <div class="rtitle">${fmtDate(r.date)}</div>
          <div class="rdate">${entries.length} player${entries.length===1?'':'s'}</div>
          ${teeBits.length ? `<div class="rtee">${escapeHtml(teeBits.join(' · '))}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          ${isOwner ? `<button class="btn small ghost" onclick="event.stopPropagation(); editRound('${tripId}','${r.id}')">Edit</button>` : ''}
          ${isOwner ? `<button class="btn small danger" onclick="event.stopPropagation(); deleteRound('${tripId}','${r.id}')">Delete</button>` : ''}
          <span class="chev">›</span>
        </div>
      </div>
      <div class="rbody">
        <div class="scorecard-wrap">${buildScorecardTable(r)}</div>
      </div>
    </div>`;
}

function tripHandicap(trip, pid) {
  const h = trip && trip.roster && trip.roster[pid];
  return h ? String(h).trim() : '';
}
function playerCell(trip, pid) {
  const hcp = tripHandicap(trip, pid);
  return `${escapeHtml(playerName(pid))}${hcp ? ` <span class="hcp-tag">(${escapeHtml(hcp)})</span>` : ''}`;
}

function renderTrip(tripId, main, crumbs, courseSlug, openRoundId) {
  const trip = store.trips.find(t => t.id === tripId);
  crumbs.innerHTML = `<a href="#/">Home</a>`;
  if (!trip) {
    main.innerHTML = `<p class="tag">This trip isn't in the ledger (yet). <a href="#/">Back home</a></p>`;
    return;
  }
  watchRounds(tripId);
  const rounds = store.roundsByTrip[tripId] || [];
  const board = tripLeaderboard(tripId);
  const courses = tripCourses(tripId);

  const openCourseKey = courseSlug ? decodeURIComponent(courseSlug).toLowerCase() : null;

  const boardRows = board.map((row, i) => `
    <tr class="${i === 0 ? 'rank1' : ''}">
      <td class="rankcell">${i + 1}</td>
      <td class="player">${playerCell(trip, row.pid)}</td>
      <td class="num">${row.rounds}</td>
      <td class="num ${toParClass(row.toPar)}">${toParLabel(row.toPar)}</td>
      <td class="num">${row.netToPar === null ? '–' : `<span class="${toParClass(row.netToPar)}">${toParLabel(row.netToPar)}</span>`}</td>
      <td class="num">${row.best ?? '–'}</td>
    </tr>`).join('') || `<tr><td colspan="6" class="empty" style="border:none;">No rounds logged yet.</td></tr>`;

  const courseRows = courses.map(c => {
    const isOpen = (openCourseKey && c.key === openCourseKey);
    const cBoard = courseLeaderboard(c.rounds, trip);
    const leader = cBoard[0];
    const dates = c.rounds.map(r => r.date).filter(Boolean).sort();
    const dateMeta = dates.length ? fmtRange(dates[0], dates[dates.length - 1]) : '';
    const cBoardRows = cBoard.map((row, i) => `
      <tr class="${i === 0 ? 'rank1' : ''}">
        <td class="rankcell">${i + 1}</td>
        <td class="player">${playerCell(trip, row.pid)}</td>
        <td class="num">${row.rounds}</td>
        <td class="num ${toParClass(row.toPar)}">${toParLabel(row.toPar)}</td>
        <td class="num">${row.netToPar === null ? '–' : `<span class="${toParClass(row.netToPar)}">${toParLabel(row.netToPar)}</span>`}</td>
      </tr>`).join('');
    const roundCards = c.rounds.map(r => renderRoundCard(tripId, r, r.id === openRoundId)).join('');

    return `
      <div class="course-row ${isOpen ? 'open' : ''}" id="courserow-${c.key}">
        <div class="chead" onclick="toggleCourseRow('${jsAttr(c.key)}')">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="meta">${c.rounds.length} round${c.rounds.length===1?'':'s'}${dateMeta ? ' · ' + dateMeta : ''}</div>
          <div class="lead">
            <div>
              ${leader ? `<div class="who">${escapeHtml(playerName(leader.pid))} ${toParLabel(leader.toPar)}</div>` : `<div>No scores yet</div>`}
            </div>
            <span class="chev">›</span>
          </div>
        </div>
        <div class="cdrawer">
          ${cBoard.length ? `
            <table class="board" style="margin-bottom:18px;">
              <thead><tr><th></th><th>Player</th><th class="num">Rds</th><th class="num">Gross to par</th><th class="num">Net to par</th></tr></thead>
              <tbody>${cBoardRows}</tbody>
            </table>` : ''}
          ${roundCards}
          ${isOwner ? `<button class="btn small ghost" onclick="event.stopPropagation(); openRoundModal('${tripId}', '${jsAttr(c.name)}')">+ Add round here</button>` : ''}
        </div>
      </div>`;
  }).join('');

  const courseListHtml = courses.length
    ? `<div class="ledger">${courseRows}</div>`
    : `<div class="empty">No courses played yet on this trip.${isOwner ? ' Add the first one to start the scorecard.' : ''}</div>`;

  const rosterCount = Object.keys(trip.roster || {}).length;

  main.innerHTML = `
    <div class="trip-head">
      <h1>${escapeHtml(trip.name)}</h1>
      <div class="loc">${escapeHtml(trip.location || '')}${trip.location ? ' · ' : ''}${tripDateRange(tripId)}</div>
      <div class="stats">
        <div class="stat"><div class="n">${rosterCount}</div><div class="l">PLAYERS</div></div>
        <div class="stat"><div class="n">${courses.length}</div><div class="l">COURSES</div></div>
        <div class="stat"><div class="n">${rounds.length}</div><div class="l">ROUNDS</div></div>
        <div class="stat"><div class="n">${board[0] ? toParLabel(board[0].toPar) : '–'}</div><div class="l">TRIP LEADER</div></div>
      </div>
    </div>

    <div class="section-head"><h2>Overall leaderboard</h2></div>
    <table class="board">
      <thead><tr><th></th><th>Player</th><th class="num">Rds</th><th class="num">Gross to par</th><th class="num">Net to par</th><th class="num">Best</th></tr></thead>
      <tbody>${boardRows}</tbody>
    </table>

    <div class="section-head" style="margin-top:30px;"><h2>Courses played</h2></div>
    ${courseListHtml}

    ${isOwner ? `
    <div class="toolbar">
      <button class="btn" onclick="openRoundModal('${tripId}')">+ Add course</button>
      <button class="btn ghost" onclick="openTripModal('${tripId}')">Edit trip</button>
      <button class="btn danger" onclick="deleteTrip('${tripId}')">Delete trip</button>
    </div>` : ''}
  `;

  if (openRoundId) {
    const el = document.getElementById(`round-${openRoundId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (openCourseKey) {
    const el = document.getElementById(`courserow-${openCourseKey}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* Aggregate every course played across all trips, for the "Courses played"
   directory. Net-to-par isn't shown here since handicaps are trip-specific;
   this view sticks to gross scoring. */
function allCoursesPlayed() {
  const byKey = {};
  const groups = [];
  store.trips.forEach(t => {
    const rounds = store.roundsByTrip[t.id] || [];
    rounds.forEach(r => {
      const name = (r.course || t.course || 'Unspecified course').trim() || 'Unspecified course';
      const key = name.toLowerCase();
      if (!byKey[key]) {
        byKey[key] = { key, name, rounds: [], trips: {} };
        groups.push(byKey[key]);
      }
      byKey[key].rounds.push(r);
      if (!byKey[key].trips[t.id]) byKey[key].trips[t.id] = { tripId: t.id, tripName: t.name, count: 0 };
      byKey[key].trips[t.id].count += 1;
    });
  });
  return groups
    .map(g => ({ ...g, tripList: Object.values(g.trips) }))
    .sort((a, b) => b.rounds.length - a.rounds.length);
}

function renderAllCourses(main, openKey) {
  const groups = allCoursesPlayed();
  const decodedOpenKey = openKey ? decodeURIComponent(openKey).toLowerCase() : null;

  const rows = groups.map(g => {
    const isOpen = decodedOpenKey === g.key;
    const dates = g.rounds.map(r => r.date).filter(Boolean).sort();
    const dateMeta = dates.length ? fmtRange(dates[0], dates[dates.length - 1]) : '';
    const board = buildLeaderboard(g.rounds, null);
    const leader = board[0];
    const boardRows = board.map((row, i) => `
      <tr class="${i === 0 ? 'rank1' : ''}">
        <td class="rankcell">${i + 1}</td>
        <td class="player">${escapeHtml(playerName(row.pid))}</td>
        <td class="num">${row.rounds}</td>
        <td class="num ${toParClass(row.toPar)}">${toParLabel(row.toPar)}</td>
        <td class="num">${row.best ?? '–'}</td>
      </tr>`).join('');
    const tripsHtml = g.tripList.map(t => `
      <div class="player-row">
        <a href="#/trip/${t.tripId}/${encodeURIComponent(g.key)}"><span class="pname">${escapeHtml(t.tripName)}</span></a>
        <span class="phcp">${t.count} round${t.count===1?'':'s'}</span>
      </div>`).join('');

    return `
      <div class="course-row ${isOpen ? 'open' : ''}" id="courserow-${g.key}">
        <div class="chead" onclick="toggleCourseRow('${jsAttr(g.key)}')">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="meta">${g.rounds.length} round${g.rounds.length===1?'':'s'} · ${g.tripList.length} trip${g.tripList.length===1?'':'s'}${dateMeta ? ' · ' + dateMeta : ''}</div>
          <div class="lead">
            <div>
              ${leader ? `<div class="who">${escapeHtml(playerName(leader.pid))} ${toParLabel(leader.toPar)}</div>` : `<div>No scores yet</div>`}
            </div>
            <span class="chev">›</span>
          </div>
        </div>
        <div class="cdrawer">
          ${board.length ? `
            <table class="board" style="margin-bottom:14px;">
              <thead><tr><th></th><th>Player</th><th class="num">Rds</th><th class="num">Gross to par</th><th class="num">Best</th></tr></thead>
              <tbody>${boardRows}</tbody>
            </table>` : ''}
          <label class="tag">Played on</label>
          <div>${tripsHtml}</div>
        </div>
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="section-head"><h2>Courses played</h2></div>
    <div class="ledger">${rows || `<div class="empty">No rounds logged yet across any trip.</div>`}</div>
  `;
}

function renderStats(main) {
  const agg = careerStats();
  const rows = agg.map((row, i) => `
    <tr class="${i === 0 ? 'rank1' : ''}">
      <td class="rankcell">${i + 1}</td>
      <td class="player">${escapeHtml(playerName(row.pid))} ${row.wins > 0 ? `<span class="badge">${row.wins} trip win${row.wins===1?'':'s'}</span>` : ''}</td>
      <td class="num">${row.trips}</td>
      <td class="num">${row.rounds}</td>
      <td class="num">${row.avg ? row.avg.toFixed(1) : '–'}</td>
      <td class="num">${row.best ?? '–'}</td>
      <td class="num ${toParClass(row.toPar)}">${toParLabel(row.toPar)}</td>
    </tr>`).join('') || `<tr><td colspan="7" class="empty" style="border:none;">No rounds logged yet across any trip.</td></tr>`;

  main.innerHTML = `
    <div class="section-head"><h2>Career stats</h2></div>
    <table class="board">
      <thead><tr><th></th><th>Player</th><th class="num">Trips</th><th class="num">Rounds</th><th class="num">Avg</th><th class="num">Best</th><th class="num">Gross to par</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

/* ======================= Mutations ======================= */
async function addPlayerSubmit(e) {
  e.preventDefault();
  if (!isOwner) return false;
  const name = document.getElementById('newPlayerName').value.trim();
  const hcp = document.getElementById('newPlayerHcp').value.trim();
  if (!name || !db) return false;
  const data = { name, createdAt: Date.now() };
  if (hcp) data.handicap = hcp;
  await db.collection('players').add(data);
  document.getElementById('newPlayerName').value = '';
  document.getElementById('newPlayerHcp').value = '';
  return false;
}

async function removePlayer(id) {
  if (!db || !isOwner) return;
  if (!confirm('Remove this player from the roster? Past scores stay in the ledger.')) return;
  await db.collection('players').doc(id).delete();
}

async function deleteTrip(tripId) {
  if (!db || !isOwner) return;
  if (!confirm('Delete this whole trip, including its rounds? This cannot be undone.')) return;
  const rounds = store.roundsByTrip[tripId] || [];
  for (const r of rounds) {
    await db.collection(`trips/${tripId}/rounds`).doc(r.id).delete();
  }
  await db.collection('trips').doc(tripId).delete();
  location.hash = '#/';
}

function editRound(tripId, roundId) {
  if (!isOwner) return;
  const round = (store.roundsByTrip[tripId] || []).find(r => r.id === roundId);
  if (!round) return;
  openRoundModal(tripId, null, round);
}

async function deleteRound(tripId, roundId) {
  if (!db || !isOwner) return;
  if (!confirm('Delete this round?')) return;
  await db.collection(`trips/${tripId}/rounds`).doc(roundId).delete();
}

}

function openTripModal(tripId) {
  if (!isOwner) return;
  const editing = !!tripId;
  const trip = editing ? store.trips.find(t => t.id === tripId) : null;
  const roster = (trip && trip.roster) || {};
  const wrap = document.createElement('div');
  wrap.className = 'overlay';

  const rosterRows = store.players.map(p => {
    const checked = Object.prototype.hasOwnProperty.call(roster, p.id);
    const hcpVal = checked ? (roster[p.id] || '') : '';
    return `
      <div class="trip-roster-row">
        <label><input type="checkbox" class="trip-roster-check" value="${p.id}" ${checked ? 'checked' : ''}> ${escapeHtml(p.name)}</label>
        <input type="text" class="trip-roster-hcp" data-pid="${p.id}" placeholder="Handicap" value="${escapeHtml(hcpVal)}">
      </div>`;
  }).join('') || `<p class="tag">No players on the roster yet — add some on the Roster page, then come back to build this trip's roster.</p>`;

  wrap.innerHTML = `
    <div class="modal">
      <h2>${editing ? 'Edit trip' : 'New trip'}</h2>
      <form id="tripForm">
        <div class="field"><label>Trip name</label>
          <input type="text" id="tName" required value="${trip ? escapeHtml(trip.name) : ''}" placeholder="e.g. Pinehurst Weekend">
        </div>
        <div class="field"><label>Location</label>
          <input type="text" id="tLocation" required value="${trip ? escapeHtml(trip.location || '') : ''}" placeholder="e.g. Pinehurst, NC">
        </div>
        <div class="field">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <label style="margin:0;">Trip roster — check who's coming and set their handicap for this trip</label>
            <div style="display:flex; gap:8px; flex-shrink:0;">
              <button type="button" class="btn ghost small" onclick="selectAllTripRoster()">Select all</button>
              <button type="button" class="btn ghost small" onclick="clearAllTripRoster()">Clear</button>
            </div>
          </div>
          <div class="trip-roster-list">${rosterRows}</div>
        </div>
        <div class="actions">
          <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">${editing ? 'Save' : 'Create trip'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeModal(); });
  document.getElementById('tripForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!db || !isOwner) { closeModal(); return; }

    const newRoster = {};
    let anySelected = false;
    document.querySelectorAll('.trip-roster-check').forEach(cb => {
      if (cb.checked) {
        anySelected = true;
        const hcpInput = document.querySelector(`.trip-roster-hcp[data-pid="${cb.value}"]`);
        newRoster[cb.value] = hcpInput ? hcpInput.value.trim() : '';
      }
    });
    if (!anySelected) { alert("Select at least one player for the trip roster."); return; }

    const data = {
      name: document.getElementById('tName').value.trim(),
      location: document.getElementById('tLocation').value.trim(),
      roster: newRoster,
    };
    if (editing) {
      await db.collection('trips').doc(tripId).update(data);
    } else {
      data.createdAt = Date.now();
      const ref = await db.collection('trips').add(data);
      closeModal();
      location.hash = `#/trip/${ref.id}`;
      return;
    }
    closeModal();
  });
}

function selectAllTripRoster() {
  document.querySelectorAll('.trip-roster-check').forEach(cb => { cb.checked = true; });
}
function clearAllTripRoster() {
  document.querySelectorAll('.trip-roster-check').forEach(cb => { cb.checked = false; });
}

/* ======================= Round modal (full scorecard entry) =======================
   presetCourse: lock the course name (adding another round to an existing course tab)
   editingRound: pass an existing round object (with .id) to edit it in place —
   the roster picker still lets you check additional players who weren't
   originally recorded, and the Course field becomes editable again. */
function openRoundModal(tripId, presetCourse, editingRound) {
  if (!isOwner) return;
  const trip = store.trips.find(t => t.id === tripId);
  if (!trip) return;
  const editing = !!editingRound;
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'roundOverlay';

  // Scope the picker to this trip's roster when one has been set; fall back
  // to the full player list for trips created before rosters existed.
  const tripRoster = trip.roster || {};
  const rosterList = Object.keys(tripRoster).length
    ? store.players.filter(p => Object.prototype.hasOwnProperty.call(tripRoster, p.id))
    : store.players;

  // Default the player picker to whoever played the trip's most recent round —
  // usually the same group, so this saves re-clicking everyone each time.
  const allRounds = store.roundsByTrip[tripId] || [];
  const lastRound = allRounds[0];
  const defaultPlayers = editing
    ? Object.keys(editingRound.scores || {})
    : (lastRound
        ? Object.entries(lastRound.scores || {}).filter(([, h]) => h.some(x => Number(x) > 0)).map(([pid]) => pid)
        : rosterList.map(p => p.id));
  const defaultCourse = editing ? (editingRound.course || '') : (presetCourse || '');
  const courseLocked = !editing && !!presetCourse;

  wrap.innerHTML = `
    <div class="modal" style="max-width:900px;">
      <h2>${editing ? `Edit round — ${escapeHtml(defaultCourse || trip.name)}` : (presetCourse ? `Add round — ${escapeHtml(presetCourse)}` : `Add a course — ${escapeHtml(trip.name)}`)}</h2>
      <div class="row3">
        <div class="field"><label>Course</label>
          <input type="text" id="rCourse" value="${escapeHtml(defaultCourse)}" placeholder="Course name" ${courseLocked ? 'readonly' : ''}>
        </div>
        <div class="field"><label>Date</label>
          <input type="date" id="rDate" value="${editing ? (editingRound.date || '') : new Date().toISOString().slice(0,10)}">
        </div>
        <div class="field"><label>Par (total)</label>
          <input type="text" id="rParTotal" readonly value="72">
        </div>
      </div>
      <div class="field" id="courseLookupField">
        <label>Look up the course <span class="tag">(fills in par, and lets you pick a tee for rating/slope)</span></label>
        <div class="course-search-row">
          <input type="text" id="courseSearchInput" placeholder="Search course name…" value="${escapeHtml(defaultCourse)}">
          <button type="button" class="btn ghost small" onclick="searchCourseForRound()">Search</button>
        </div>
        <div id="courseSearchResults"></div>
        <div id="courseSearchStatus" class="course-search-status"></div>
        <div id="coursePickedArea"></div>
      </div>
      <div class="field" id="scanField">
        <label>Scan scorecards <span class="tag">(optional — snap a photo of a completed card; scan again for other groups)</span></label>
        <div class="scan-controls">
          <label class="btn ghost small" for="scanFileInput" style="cursor:pointer;">📷 Scan a card</label>
          <input type="file" id="scanFileInput" accept="image/*" capture="environment" onchange="handleScorecardScan(this.files[0])">
        </div>
        <div id="scanStatus" class="course-search-status"></div>
        <div id="scanReviewArea"></div>
      </div>
      <div class="field">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <label style="margin:0;">Who played ${editing ? '<span class="tag">(check anyone new to add them)</span>' : ''}</label>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ghost small" onclick="selectAllRoster()">Select all</button>
            <button type="button" class="btn ghost small" onclick="clearAllRoster()">Clear</button>
          </div>
        </div>
        <div class="roster-pick" id="rosterPick"></div>
      </div>
      <div id="scorecardEntryWrap" class="field"></div>
      <div class="actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn" onclick="saveRound('${tripId}')">${editing ? 'Save changes' : 'Save round'}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeModal(); });

  window.__roundState = {
    par: editing ? (editingRound.par || DEFAULT_PAR.slice()) : DEFAULT_PAR.slice(),
    rosterList,
    players: defaultPlayers.filter(pid => rosterList.some(p => p.id === pid)),
    existingScores: editing ? (editingRound.scores || {}) : null,
    editingRoundId: editing ? editingRound.id : null,
    teeName: editing ? (editingRound.teeName || null) : null,
    courseRating: editing ? (editingRound.courseRating || null) : null,
    slopeRating: editing ? (editingRound.slopeRating || null) : null,
    sourceCourseId: editing ? (editingRound.sourceCourseId || null) : null,
    teeOptions: [],
    scanRows: [],
    pendingScanScores: {},
  };
  renderRosterPick();
  renderScorecardEntry();

  // If we already know the course (editing, or adding another round to an
  // existing course tab), kick off a search for it automatically so the
  // tee/rating picker can appear without an extra click.
  if (defaultCourse) searchCourseForRound();
}

/* ---- course search interactions (round modal) ---- */
async function searchCourseForRound() {
  const input = document.getElementById('courseSearchInput');
  const statusEl = document.getElementById('courseSearchStatus');
  const resultsEl = document.getElementById('courseSearchResults');
  if (!input || !statusEl || !resultsEl) return;
  const q = input.value.trim();
  if (!q) return;
  resultsEl.innerHTML = '';
  statusEl.textContent = 'Searching…';
  try {
    const courses = await ogaSearchCourses(q);
    if (!courses.length) {
      statusEl.textContent = 'No matches — you can still enter the course and par by hand.';
      return;
    }
    statusEl.textContent = '';
    resultsEl.innerHTML = `<div class="course-search-results">${courses.map(c => {
      const name = escapeHtml(c.course_name || c.name || 'Unnamed course');
      const loc = escapeHtml([c.city, c.state].filter(Boolean).join(', '));
      return `<button type="button" class="csr-item" onclick="pickSearchedCourse('${jsAttr(c.id)}', '${jsAttr(c.course_name || c.name || '')}')">
        <div class="csr-name">${name}</div>
        ${loc ? `<div class="csr-loc">${loc}</div>` : ''}
      </button>`;
    }).join('')}</div>`;
  } catch (err) {
    statusEl.textContent = "Course lookup isn't reachable right now — you can still enter the course and par by hand.";
  }
}

async function pickSearchedCourse(id, name) {
  const statusEl = document.getElementById('courseSearchStatus');
  const resultsEl = document.getElementById('courseSearchResults');
  const pickedEl = document.getElementById('coursePickedArea');
  const courseInput = document.getElementById('rCourse');
  if (resultsEl) resultsEl.innerHTML = '';
  if (statusEl) statusEl.textContent = 'Loading course details…';
  if (courseInput && !courseInput.readOnly) courseInput.value = name;

  try {
    const detail = await ogaGetCourseDetail(id);
    const pars = ogaCoursePars(detail);
    const tees = Array.isArray(detail.tees) ? detail.tees.map(ogaNormalizeTee) : [];

    window.__roundState.sourceCourseId = id;
    window.__roundState.teeOptions = tees;
    if (pars) window.__roundState.par = pars;

    if (statusEl) statusEl.textContent = '';
    renderPickedCourseArea(name, tees);
    if (tees.length) onTeeSelected(0); else renderScorecardEntry();
  } catch (err) {
    if (statusEl) statusEl.textContent = "Couldn't load that course's details — you can still enter par by hand.";
  }
}

function renderPickedCourseArea(name, tees) {
  const el = document.getElementById('coursePickedArea');
  if (!el) return;
  const teeOptionsHtml = tees.map((t, i) => {
    const bits = [];
    if (t.rating) bits.push(t.rating);
    if (t.slope) bits.push(`/${t.slope}`);
    const ratingStr = bits.length ? ` — ${bits.join('')}` : '';
    return `<option value="${i}">${escapeHtml(t.name)}${t.gender ? ' (' + escapeHtml(t.gender) + ')' : ''}${escapeHtml(ratingStr)}</option>`;
  }).join('');

  el.innerHTML = `
    <div class="course-picked-chip">📍 ${escapeHtml(name)} <button type="button" onclick="clearPickedCourse()" title="Clear">✕</button></div>
    ${tees.length ? `
      <div class="tee-select-row">
        <label class="tag" style="margin:0;">Tee</label>
        <select id="teeSelect" onchange="onTeeSelected(this.value)">${teeOptionsHtml}</select>
        <span class="tee-rating-note" id="teeRatingNote"></span>
      </div>` : `<div class="course-search-status">No tee data available for this course — par row filled in where possible.</div>`}
  `;
}

function onTeeSelected(idx) {
  const st = window.__roundState;
  const tee = st.teeOptions[Number(idx)];
  if (!tee) return;
  st.teeName = tee.name;
  st.courseRating = tee.rating;
  st.slopeRating = tee.slope;
  // Prefer this tee's own per-hole par if it has a full 18; otherwise keep
  // whatever the course-level lookup already filled in.
  if (tee.holes && tee.holes.length >= 18) {
    const pars = new Array(18).fill(null);
    tee.holes.forEach(h => { if (h.number >= 1 && h.number <= 18 && h.par) pars[h.number - 1] = h.par; });
    if (pars.every(p => p)) st.par = pars;
  }
  const note = document.getElementById('teeRatingNote');
  if (note) note.textContent = (tee.rating && tee.slope) ? `Rating/Slope: ${tee.rating}/${tee.slope}` : '';
  renderScorecardEntry();
}

function clearPickedCourse() {
  const st = window.__roundState;
  st.sourceCourseId = null;
  st.teeOptions = [];
  st.teeName = null;
  st.courseRating = null;
  st.slopeRating = null;
  const pickedEl = document.getElementById('coursePickedArea');
  if (pickedEl) pickedEl.innerHTML = '';
}

function renderRosterPick() {
  const st = window.__roundState;
  const el = document.getElementById('rosterPick');
  if (!el) return;
  el.innerHTML = st.rosterList.map(p => `
    <label id="pick-${p.id}" class="${st.players.includes(p.id) ? 'checked' : ''}">
      <input type="checkbox" value="${p.id}" ${st.players.includes(p.id) ? 'checked' : ''} onchange="toggleRoundPlayer('${p.id}')"> ${escapeHtml(p.name)}
    </label>`).join('') || `<span class="tag">No players on this trip's roster yet — edit the trip to add some.</span>`;
}

function toggleRoundPlayer(pid) {
  const st = window.__roundState;
  const label = document.getElementById(`pick-${pid}`);
  const idx = st.players.indexOf(pid);
  if (idx === -1) { st.players.push(pid); label.classList.add('checked'); }
  else { st.players.splice(idx, 1); label.classList.remove('checked'); }
  renderScorecardEntry();
}

function selectAllRoster() {
  window.__roundState.players = window.__roundState.rosterList.map(p => p.id);
  renderRosterPick();
  renderScorecardEntry();
}

function clearAllRoster() {
  window.__roundState.players = [];
  renderRosterPick();
  renderScorecardEntry();
}

function renderScorecardEntry() {
  const st = window.__roundState;
  const holderEl = document.getElementById('scorecardEntryWrap');
  if (!holderEl) return;
  if (st.players.length === 0) {
    holderEl.innerHTML = `<p class="tag">Select who played to enter scores.</p>`;
    return;
  }
  const parRow = `<tr>
      <td class="rowlabel">Par</td>
      ${st.par.map((p, i) => `<td class="holecell"><input class="par-in" data-hole="${i}" type="number" min="3" max="6" value="${p}" onchange="updatePar(${i}, this.value)"></td>`).join('')}
      <td class="sum">${sumHoles(st.par,0,18)}</td>
    </tr>`;
  const headerRow = `<tr><th class="rowlabel">Hole</th>${st.par.map((p,i)=>`<th class="holecell">${i+1}</th>`).join('')}<th class="sum">TOT</th></tr>`;
  const bodyRows = st.players.map(pid => {
    const existing = (st.existingScores && st.existingScores[pid]) || (st.pendingScanScores && st.pendingScanScores[pid]);
    const cells = st.par.map((p, i) => {
      const v = existing && Number(existing[i]) > 0 ? existing[i] : '';
      return `<td><input class="score-in" type="number" min="1" max="12" data-pid="${pid}" data-hole="${i}" value="${v}" oninput="updateScoreTotal('${pid}')"></td>`;
    }).join('');
    return `<tr>
      <td class="rowlabel">${escapeHtml(playerName(pid))}</td>
      ${cells}
      <td class="sum" id="tot-${pid}">–</td>
    </tr>`;
  }).join('');

  holderEl.innerHTML = `
    <label>Scorecard</label>
    <div class="scorecard-wrap">
      <table class="scorecard">
        ${headerRow}
        ${parRow}
        ${bodyRows}
      </table>
    </div>
  `;
  document.getElementById('rParTotal').value = sumHoles(st.par, 0, 18);
  st.players.forEach(pid => updateScoreTotal(pid));
}

function updatePar(holeIdx, val) {
  window.__roundState.par[holeIdx] = Number(val) || 4;
  document.getElementById('rParTotal').value = sumHoles(window.__roundState.par, 0, 18);
  // recompute totals shown
  window.__roundState.players.forEach(pid => updateScoreTotal(pid));
}

function updateScoreTotal(pid) {
  const inputs = document.querySelectorAll(`input.score-in[data-pid="${pid}"]`);
  let total = 0, any = false;
  inputs.forEach(inp => { const v = Number(inp.value); if (v > 0) { total += v; any = true; } });
  const cell = document.getElementById(`tot-${pid}`);
  if (cell) cell.textContent = any ? total : '–';
}

/* ======================= Scorecard scanning (free, client-side OCR) =======================
   Uses Tesseract.js, loaded on demand, entirely in the browser — no account,
   no API key, no cost, and the photo never leaves the device. Handwriting
   accuracy is limited, so every detected row stays fully editable and
   nothing is added to the scorecard until the owner assigns and confirms it. */
let __tesseractLoadPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (__tesseractLoadPromise) return __tesseractLoadPromise;
  __tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load OCR library'));
    document.head.appendChild(s);
  });
  return __tesseractLoadPromise;
}

// Heuristic parse: a line with a run of plausible stroke counts (1–15) is
// treated as a candidate player row. This can't reliably tell a real score
// row from a printed par row or a phone number, so results are capped and
// always shown for review/removal rather than applied automatically.
function parseScorecardText(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const candidates = lines
    .map(line => {
      const matches = line.match(/\b([1-9]|1[0-5])\b/g);
      return { numbers: matches ? matches.map(Number) : [] };
    })
    .filter(c => c.numbers.length >= 6);
  candidates.sort((a, b) => b.numbers.length - a.numbers.length);
  return candidates.slice(0, 6).map(c => {
    const scores = new Array(18).fill(null);
    c.numbers.slice(0, 18).forEach((n, i) => { scores[i] = n; });
    return { scores, assignedPid: '' };
  });
}

async function handleScorecardScan(file) {
  if (!file) return;
  const statusEl = document.getElementById('scanStatus');
  if (statusEl) statusEl.textContent = 'Loading text recognition… (first scan takes a bit longer)';
  try {
    await loadTesseract();
    if (statusEl) statusEl.textContent = 'Reading the scorecard…';
    const worker = await Tesseract.createWorker('eng');
    const { data } = await worker.recognize(file);
    await worker.terminate();
    const rows = parseScorecardText(data.text);
    if (!rows.length) {
      statusEl.textContent = "Couldn't make out a clear row of scores in that photo — try a clearer, well-lit shot, or enter scores by hand.";
    } else {
      statusEl.textContent = `Found ${rows.length} possible row${rows.length === 1 ? '' : 's'} — assign each to a player and fix any misreads below.`;
      window.__roundState.scanRows = (window.__roundState.scanRows || []).concat(rows);
      renderScanReview();
    }
  } catch (err) {
    if (statusEl) statusEl.textContent = "Scanning didn't work on this device/browser — you can still enter scores by hand.";
  }
  const input = document.getElementById('scanFileInput');
  if (input) input.value = '';
}

function renderScanReview() {
  const st = window.__roundState;
  const el = document.getElementById('scanReviewArea');
  if (!el) return;
  if (!st.scanRows || !st.scanRows.length) { el.innerHTML = ''; return; }

  const headerRow = `<tr><th class="rowlabel">Assign to</th>${st.par.map((p, i) => `<th class="holecell">${i + 1}</th>`).join('')}<th></th></tr>`;
  const bodyRows = st.scanRows.map((row, idx) => {
    const options = st.rosterList.map(p =>
      `<option value="${p.id}" ${row.assignedPid === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
    ).join('');
    const cells = row.scores.map((v, i) =>
      `<td><input class="scan-score-in" type="number" min="1" max="15" data-row="${idx}" data-hole="${i}" value="${v ?? ''}" oninput="updateScanRowValue(${idx}, ${i}, this.value)"></td>`
    ).join('');
    return `<tr>
      <td class="rowlabel">
        <select onchange="assignScanRow(${idx}, this.value)">
          <option value="">— choose player —</option>
          ${options}
        </select>
      </td>
      ${cells}
      <td><button type="button" class="btn small ghost" onclick="removeScanRow(${idx})" title="Remove this scanned row">✕</button></td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="scorecard-wrap" style="margin-top:10px;">
      <table class="scorecard">${headerRow}${bodyRows}</table>
    </div>
    <div class="toolbar" style="margin-top:8px;">
      <button type="button" class="btn small" onclick="applyScanRows()">Add assigned rows to scorecard</button>
    </div>
  `;
}

function assignScanRow(idx, pid) {
  const st = window.__roundState;
  if (!st.scanRows[idx]) return;
  st.scanRows[idx].assignedPid = pid;
}

function updateScanRowValue(idx, holeIdx, val) {
  const st = window.__roundState;
  if (!st.scanRows[idx]) return;
  st.scanRows[idx].scores[holeIdx] = Number(val) || null;
}

function removeScanRow(idx) {
  const st = window.__roundState;
  st.scanRows.splice(idx, 1);
  renderScanReview();
}

function applyScanRows() {
  const st = window.__roundState;
  const statusEl = document.getElementById('scanStatus');
  const remaining = [];
  let appliedCount = 0;
  st.scanRows.forEach(row => {
    if (!row.assignedPid) { remaining.push(row); return; }
    st.pendingScanScores[row.assignedPid] = row.scores.map(v => Number(v) || 0);
    if (!st.players.includes(row.assignedPid)) st.players.push(row.assignedPid);
    appliedCount++;
  });
  st.scanRows = remaining;
  if (statusEl) {
    statusEl.textContent = appliedCount
      ? `Added ${appliedCount} scanned row${appliedCount === 1 ? '' : 's'} to the scorecard below — double-check the numbers.`
      : 'Choose a player for each row before adding it to the scorecard.';
  }
  renderRosterPick();
  renderScorecardEntry();
  renderScanReview();
}

async function saveRound(tripId) {
  if (!db || !isOwner) { closeModal(); return; }
  const st = window.__roundState;
  if (!st.players.length) { alert('Select at least one player.'); return; }
  const scores = {};
  st.players.forEach(pid => {
    const holes = [];
    for (let i = 0; i < 18; i++) {
      const inp = document.querySelector(`input.score-in[data-pid="${pid}"][data-hole="${i}"]`);
      holes.push(inp ? (Number(inp.value) || 0) : 0);
    }
    scores[pid] = holes;
  });
  const data = {
    course: document.getElementById('rCourse').value.trim(),
    date: document.getElementById('rDate').value || new Date().toISOString().slice(0,10),
    par: st.par,
    scores,
  };
  if (st.teeName) data.teeName = st.teeName;
  if (st.courseRating) data.courseRating = st.courseRating;
  if (st.slopeRating) data.slopeRating = st.slopeRating;
  if (st.sourceCourseId) data.sourceCourseId = st.sourceCourseId;

  let roundId = st.editingRoundId;
  if (roundId) {
    await db.collection(`trips/${tripId}/rounds`).doc(roundId).update(data);
  } else {
    data.createdAt = Date.now();
    const ref = await db.collection(`trips/${tripId}/rounds`).add(data);
    roundId = ref.id;
  }
  closeModal();
  watchRounds(tripId);
  const courseKey = (data.course || (store.trips.find(t => t.id === tripId)?.course) || 'Unspecified course').trim().toLowerCase() || 'unspecified course';
  location.hash = `#/trip/${tripId}/${encodeURIComponent(courseKey)}/${roundId}`;
}

function closeModal() {
  const ov = document.querySelector('.overlay');
  if (ov) ov.remove();
  window.__roundState = null;
}

/* ======================= Boot ======================= */
initDb();
render();
</script>
