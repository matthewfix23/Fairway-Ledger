/* ======================= Records =======================
   Fun all-time records and charts built from every round on every trip.
   Everything is derived on the fly from store data — nothing extra is saved. */
function shortName(pid) {
  const full = playerName(pid);
  const [first, ...rest] = full.split(' ');
  const clash = store.players.some(p => p.id !== pid && p.name.split(' ')[0] === first);
  return clash && rest.length ? `${first} ${rest[rest.length - 1][0]}.` : first;
}

// One entry per player per round, with everything the records need.
function collectPlayerRounds() {
  const out = [];
  store.trips.forEach(t => {
    (store.roundsByTrip[t.id] || []).forEach(r => {
      const par = r.par || DEFAULT_PAR;
      const parTotal = sumHoles(par, 0, 18);
      roundPlayerIds(r).forEach(pid => {
        const gross = playerRoundTotal(r, pid);
        const hcpStr = (t.roster || {})[pid];
        const hi = hcpStr ? parseFloat(hcpStr) : NaN;
        const courseHcp = isNaN(hi) ? null : (r.courseRating && r.slopeRating)
          ? Math.round(hi * (Number(r.slopeRating) / 113) + (Number(r.courseRating) - parTotal))
          : Math.round(hi);
        const holes = (r.scores || {})[pid];
        out.push({
          pid, trip: t, round: r, date: r.date || '', course: r.course || 'Unspecified course',
          par, parTotal, gross, toPar: gross - parTotal,
          netToPar: courseHcp === null ? null : gross - parTotal - courseHcp,
          holes: hasHoleScores(holes) ? holes.map(Number) : null,
        });
      });
    });
  });
  return out;
}

// Per-hole result vs par: 'eagle' (or better), 'birdie', 'par', 'bogey', 'double', 'triple' (or worse).
const MIX_KEYS = ['birdie', 'par', 'bogey', 'double', 'triple'];
const MIX_LABELS = { birdie: 'Birdie or better', par: 'Par', bogey: 'Bogey', double: 'Double', triple: 'Triple+' };
function holeResults(pr) {
  const counts = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0 };
  if (!pr.holes) return counts;
  pr.holes.forEach((s, i) => {
    if (!s) return;
    const d = s - (Number(pr.par[i]) || 4);
    if (d <= -2) counts.eagle++;
    else if (d === -1) counts.birdie++;
    else if (d === 0) counts.par++;
    else if (d === 1) counts.bogey++;
    else if (d === 2) counts.double++;
    else counts.triple++;
  });
  return counts;
}

function recordWhere(pr) {
  return `${escapeHtml(pr.course)} · ${escapeHtml(pr.trip.name)}${pr.date ? ' · ' + fmtDate(pr.date) : ''}`;
}

// A top-3 card. rows: [{ pid, value (headline), sub (detail line) }]
function recordCard(title, blurb, rows) {
  const medals = ['1', '2', '3'];
  const body = rows.length ? rows.slice(0, 3).map((row, i) => `
    <li class="rec-row">
      <span class="rec-medal m${i + 1}">${medals[i]}</span>
      <div class="rec-who">
        <div class="rec-name">${escapeHtml(playerName(row.pid))}</div>
        <div class="rec-sub">${row.sub}</div>
      </div>
      <div class="rec-val num">${row.value}</div>
    </li>`).join('') : `<li class="rec-empty">Not enough data yet.</li>`;
  return `<div class="rec-card"><h3>${title}</h3><p class="rec-blurb">${blurb}</p><ol class="rec-list">${body}</ol></div>`;
}

function renderRecords(main) {
  const prs = collectPlayerRounds();
  if (!prs.length) {
    main.innerHTML = `<div class="section-head"><h2>Records</h2></div><div class="empty">No rounds logged yet — records show up once scores are in.</div>`;
    return;
  }
  const byDateAsc = (a, b) => a.date.localeCompare(b.date);
  const withHoles = prs.filter(p => p.holes);

  // ---- headline tiles ----
  const roundsCount = new Set(prs.map(p => p.round.id)).size;
  const coursesCount = new Set(prs.map(p => p.course.trim().toLowerCase())).size;
  const tripsCount = new Set(prs.map(p => p.trip.id)).size;
  const totalStrokes = prs.reduce((s, p) => s + p.gross, 0);
  const allMix = withHoles.reduce((m, p) => { const c = holeResults(p); Object.keys(m).forEach(k => m[k] += c[k]); return m; }, { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0 });
  const tiles = [
    [tripsCount, 'Trips'], [roundsCount, 'Rounds'], [coursesCount, 'Courses'],
    [totalStrokes.toLocaleString(), 'Strokes'], [allMix.birdie + allMix.eagle, 'Birdies+'],
  ].map(([n, l]) => `<div class="rec-tile"><div class="n num">${n}</div><div class="l">${l}</div></div>`).join('');

  // ---- record cards ----
  const fmtPar = n => toParLabel(n);
  const bestGross = [...prs].sort((a, b) => a.gross - b.gross || a.toPar - b.toPar || byDateAsc(a, b))
    .map(p => ({ pid: p.pid, value: `${p.gross} <span class="rec-par">${fmtPar(p.toPar)}</span>`, sub: recordWhere(p) }));
  const bestNet = prs.filter(p => p.netToPar !== null).sort((a, b) => a.netToPar - b.netToPar || byDateAsc(a, b))
    .map(p => ({ pid: p.pid, value: fmtPar(p.netToPar), sub: `${p.gross} gross · ${recordWhere(p)}` }));
  const bigNumber = [...prs].sort((a, b) => b.gross - a.gross || b.toPar - a.toPar || byDateAsc(a, b))
    .map(p => ({ pid: p.pid, value: `${p.gross} <span class="rec-par">${fmtPar(p.toPar)}</span>`, sub: recordWhere(p) }));

  // Best trip: lowest average gross per round (2+ rounds on the trip).
  const tripAgg = {};
  prs.forEach(p => {
    const k = p.trip.id + ':' + p.pid;
    const a = tripAgg[k] || (tripAgg[k] = { pid: p.pid, trip: p.trip, n: 0, gross: 0, toPar: 0 });
    a.n++; a.gross += p.gross; a.toPar += p.toPar;
  });
  const bestTrip = Object.values(tripAgg).filter(a => a.n >= 2).sort((a, b) => a.gross / a.n - b.gross / b.n)
    .map(a => ({ pid: a.pid, value: (a.gross / a.n).toFixed(1), sub: `avg over ${a.n} rounds · ${escapeHtml(a.trip.name)}` }));

  const mostBirdies = withHoles.map(p => ({ p, c: holeResults(p) }))
    .map(x => ({ ...x, b: x.c.birdie + x.c.eagle })).filter(x => x.b > 0)
    .sort((a, b) => b.b - a.b || a.p.gross - b.p.gross)
    .map(x => ({ pid: x.p.pid, value: x.b, sub: `${x.p.gross} gross · ${recordWhere(x.p)}` }));

  const nines = [];
  withHoles.forEach(p => {
    nines.push({ p, side: 'Front', score: sumHoles(p.holes, 0, 9), par: sumHoles(p.par, 0, 9) });
    nines.push({ p, side: 'Back', score: sumHoles(p.holes, 9, 18), par: sumHoles(p.par, 9, 18) });
  });
  const bestNine = nines.sort((a, b) => (a.score - a.par) - (b.score - b.par) || a.score - b.score)
    .map(n => ({ pid: n.p.pid, value: `${n.score} <span class="rec-par">${fmtPar(n.score - n.par)}</span>`, sub: `${n.side} 9 · ${recordWhere(n.p)}` }));

  const holeBlowups = [];
  withHoles.forEach(p => p.holes.forEach((s, i) => {
    const par = Number(p.par[i]) || 4;
    if (s - par >= 3) holeBlowups.push({ p, hole: i + 1, s, par });
  }));
  const blowups = holeBlowups.sort((a, b) => (b.s - b.par) - (a.s - a.par) || b.s - a.s)
    .map(h => ({ pid: h.p.pid, value: `${h.s} <span class="rec-par">on a par ${h.par}</span>`, sub: `Hole ${h.hole} · ${recordWhere(h.p)}` }));

  const careerBirdies = {};
  withHoles.forEach(p => {
    const c = holeResults(p);
    const a = careerBirdies[p.pid] || (careerBirdies[p.pid] = { pid: p.pid, b: 0, e: 0, rounds: 0 });
    a.b += c.birdie; a.e += c.eagle; a.rounds++;
  });
  const birdieKings = Object.values(careerBirdies).filter(a => a.b + a.e > 0).sort((a, b) => (b.b + b.e) - (a.b + a.e))
    .map(a => ({ pid: a.pid, value: a.b + a.e, sub: `${a.e ? `${a.e} eagle${a.e === 1 ? '' : 's'} · ` : ''}${((a.b + a.e) / a.rounds).toFixed(1)} per round over ${a.rounds}` }));

  const cards = [
    recordCard('Low gross round', 'Fewest strokes in a single round.', bestGross),
    recordCard('Low net round', 'Best score to par after handicap.', bestNet),
    recordCard('Best trip', 'Lowest scoring average across a trip.', bestTrip),
    recordCard('Best nine', 'Lowest front or back nine, to par.', bestNine),
    recordCard('Birdie fest', 'Most birdies (or better) in one round.', mostBirdies),
    recordCard('Birdie kings', 'Most birdies (or better), all time.', birdieKings),
    recordCard('The big number', 'Highest single-round score. Someone has to.', bigNumber),
    recordCard('Snowman club', 'Worst single hole, by strokes over par.', blowups),
  ].join('');

  // ---- trip champions ----
  const trips = [...store.trips].filter(t => (store.roundsByTrip[t.id] || []).length)
    .sort((a, b) => (tripLastPlayedDate(a.id) || '').localeCompare(tripLastPlayedDate(b.id) || ''));
  const champRows = trips.map(t => {
    const game = tripGame(t);
    const winnerFor = g => { const b = sortForGame(tripLeaderboard(t.id).slice(), g); return b[0] && gameValue(b[0], g) !== null ? b[0] : null; };
    const cell = g => { const w = winnerFor(g); return w ? `${escapeHtml(shortName(w.pid))} <span class="rec-par">${gameLabel(w, g)}</span>` : '–'; };
    const champ = winnerFor(game);
    return `<tr>
      <td><a href="#/trip/${t.id}">${escapeHtml(t.name)}</a><div class="rec-sub">${tripDateRange(t.id)}</div></td>
      <td>${champ ? `<span class="champ">🏆 ${escapeHtml(playerName(champ.pid))}</span> <span class="rec-par">${GAMES[game].label} ${gameLabel(champ, game)}</span>` : '–'}</td>
      <td class="hide-sm">${cell('gross')}</td>
      <td class="hide-sm">${cell('net')}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="section-head"><h2>Records</h2></div>
    <div class="rec-tiles">${tiles}</div>
    <div class="rec-grid">${cards}</div>

    <div class="section-head" style="margin-top:34px;"><h2>Trip champions</h2></div>
    <table class="board champ-table">
      <thead><tr><th>Trip</th><th>Champion <span class="tag">(trip's game)</span></th><th class="hide-sm">Low gross</th><th class="hide-sm">Low net</th></tr></thead>
      <tbody>${champRows}</tbody>
    </table>

    <div class="section-head" style="margin-top:34px;"><h2>Scoring average</h2></div>
    <p class="tag chart-note">Average gross score per round, all trips. Tap a bar for details.</p>
    ${scoringAverageChart(prs)}

    <div class="section-head" style="margin-top:34px;"><h2>Scoring mix</h2></div>
    <p class="tag chart-note">Share of holes by result, from hole-by-hole scorecards only.</p>
    ${scoringMixChart(withHoles)}

    <div class="section-head" style="margin-top:34px;"><h2>Toughest courses</h2></div>
    <p class="tag chart-note">Average strokes over par per round at each course, hardest first.</p>
    ${courseDifficultyChart(prs)}

    <div class="section-head" style="margin-top:34px;"><h2>Trip by trip</h2></div>
    <p class="tag chart-note">Each player's average gross per trip, oldest to newest. Lower is better.</p>
    ${tripTrendCharts(prs, trips)}
  `;
}

/* Horizontal bars: one series, sorted, value labelled at the bar end. */
function hbarChart(items, { fmt, min = 0, cls = '' }) {
  const max = Math.max(...items.map(i => i.value));
  const lo = Math.min(min, ...items.map(i => i.value));
  const span = (max - lo) || 1;
  return `<div class="hbar-chart ${cls}">${items.map(i => `
    <div class="hbar-row" data-tip="${escapeHtml(i.tip)}" tabindex="0">
      <div class="hbar-label">${escapeHtml(i.label)}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, ((i.value - lo) / span) * 100)}%"></div></div>
      <div class="hbar-val num">${fmt(i.value)}</div>
    </div>`).join('')}</div>`;
}

function scoringAverageChart(prs) {
  const agg = {};
  prs.forEach(p => { const a = agg[p.pid] || (agg[p.pid] = { n: 0, g: 0, best: Infinity }); a.n++; a.g += p.gross; a.best = Math.min(a.best, p.gross); });
  const items = Object.entries(agg).map(([pid, a]) => ({
    label: shortName(pid), value: a.g / a.n,
    tip: `${playerName(pid)}: ${(a.g / a.n).toFixed(1)} avg over ${a.n} rounds · best ${a.best}`,
  })).sort((a, b) => a.value - b.value);
  // Start the axis a bit below the best average so differences are visible.
  const floor = Math.floor(Math.min(...items.map(i => i.value)) / 5) * 5 - 5;
  return hbarChart(items, { fmt: v => v.toFixed(1), min: floor }) + `<div class="chart-axis-note">Bars start at ${floor}</div>`;
}

function scoringMixChart(withHoles) {
  if (!withHoles.length) return `<div class="empty">No hole-by-hole scorecards yet.</div>`;
  const agg = {};
  withHoles.forEach(p => {
    const c = holeResults(p);
    const a = agg[p.pid] || (agg[p.pid] = { birdie: 0, par: 0, bogey: 0, double: 0, triple: 0, holes: 0 });
    a.birdie += c.birdie + c.eagle; a.par += c.par; a.bogey += c.bogey; a.double += c.double; a.triple += c.triple;
    a.holes += c.eagle + c.birdie + c.par + c.bogey + c.double + c.triple;
  });
  // Best ball-strikers first: most birdies + pars.
  const rows = Object.entries(agg).sort((x, y) => (y[1].birdie + y[1].par) / y[1].holes - (x[1].birdie + x[1].par) / x[1].holes);
  const legend = MIX_KEYS.map(k => `<span class="mix-key"><span class="mix-swatch mix-${k}"></span>${MIX_LABELS[k]}</span>`).join('');
  const bars = rows.map(([pid, a]) => `
    <div class="mix-row">
      <div class="hbar-label">${escapeHtml(shortName(pid))}</div>
      <div class="mix-bar">${MIX_KEYS.map(k => {
        const pct = a[k] / a.holes * 100;
        if (!a[k]) return '';
        return `<div class="mix-seg mix-${k}" style="width:${pct}%" data-tip="${escapeHtml(`${playerName(pid)} — ${MIX_LABELS[k]}: ${a[k]} of ${a.holes} holes (${pct.toFixed(0)}%)`)}" tabindex="0">${pct >= 11 ? `<span>${pct.toFixed(0)}%</span>` : ''}</div>`;
      }).join('')}</div>
    </div>`).join('');
  return `<div class="mix-legend">${legend}</div><div class="mix-chart">${bars}</div>`;
}

function courseDifficultyChart(prs) {
  const agg = {};
  prs.forEach(p => {
    const k = p.course.trim().toLowerCase();
    const a = agg[k] || (agg[k] = { name: p.course.trim(), n: 0, over: 0, par: p.parTotal });
    a.n++; a.over += p.toPar;
  });
  const items = Object.values(agg).map(a => ({
    label: a.name, value: a.over / a.n,
    tip: `${a.name} (par ${a.par}): +${(a.over / a.n).toFixed(1)} per round over ${a.n} player-rounds`,
  })).sort((a, b) => b.value - a.value);
  return hbarChart(items, { fmt: v => `+${v.toFixed(1)}`, cls: 'course-bars' });
}

/* Small multiples: one sparkline per player, trips on a shared x-axis and a
   shared y-scale so the panels compare honestly. */
function tripTrendCharts(prs, trips) {
  const W = 220, H = 70, PADX = 8, PADY = 12;
  const tripIdx = Object.fromEntries(trips.map((t, i) => [t.id, i]));
  const per = {};
  prs.forEach(p => {
    const k = p.pid, ti = tripIdx[p.trip.id];
    if (ti === undefined) return;
    const pl = per[k] || (per[k] = {});
    const c = pl[ti] || (pl[ti] = { n: 0, g: 0 });
    c.n++; c.g += p.gross;
  });
  const all = Object.values(per).flatMap(pl => Object.values(pl).map(c => c.g / c.n));
  const yMin = Math.floor(Math.min(...all)), yMax = Math.ceil(Math.max(...all));
  const x = i => PADX + (trips.length > 1 ? i * (W - 2 * PADX) / (trips.length - 1) : (W - 2 * PADX) / 2);
  const y = v => PADY + (v - yMin) / ((yMax - yMin) || 1) * (H - 2 * PADY); // lower score sits higher
  const panels = Object.entries(per)
    .map(([pid, pl]) => ({ pid, pts: Object.entries(pl).map(([ti, c]) => ({ ti: +ti, v: c.g / c.n, n: c.n })).sort((a, b) => a.ti - b.ti) }))
    .filter(p => p.pts.length >= 2)
    .sort((a, b) => b.pts.length - a.pts.length || playerName(a.pid).localeCompare(playerName(b.pid)))
    .map(({ pid, pts }) => {
      const best = pts.reduce((m, p) => p.v < m.v ? p : m, pts[0]);
      const last = pts[pts.length - 1], first = pts[0];
      const delta = last.v - first.v;
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.ti).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      const dots = pts.map(p => `<circle cx="${x(p.ti).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${p === best ? 4.5 : 3.5}" class="${p === best ? 'spark-best' : 'spark-dot'}" data-tip="${escapeHtml(`${playerName(pid)} — ${trips[p.ti].name}: ${p.v.toFixed(1)} avg (${p.n} rds)`)}" tabindex="0"></circle>`).join('');
      return `<div class="spark-card">
        <div class="spark-head"><span class="spark-name">${escapeHtml(shortName(pid))}</span>
          <span class="spark-delta ${delta < 0 ? 'topar-under' : delta > 0 ? 'topar-over' : ''}">${delta < 0 ? '▼' : delta > 0 ? '▲' : '•'} ${Math.abs(delta).toFixed(1)}</span></div>
        <svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="${escapeHtml(playerName(pid))} trip averages">
          <line x1="${PADX}" x2="${W - PADX}" y1="${y(best.v).toFixed(1)}" y2="${y(best.v).toFixed(1)}" class="spark-grid"></line>
          <path d="${path}" class="spark-line"></path>${dots}
        </svg>
        <div class="spark-foot"><span>Best ${best.v.toFixed(1)} · ${escapeHtml(trips[best.ti].name)}</span><span>Now ${last.v.toFixed(1)}</span></div>
      </div>`;
    }).join('');
  if (!panels) return `<div class="empty">Trends appear once players have two or more trips.</div>`;
  return `<div class="spark-grid-wrap">${panels}</div><div class="chart-axis-note">Shared scale ${yMin}–${yMax}; the highlighted dot is each player's best trip. ▼ means their average dropped from first trip to latest.</div>`;
}

/* One floating tooltip for every [data-tip] element (charts and bars).
   Hover on desktop; tap (or keyboard focus) on phones. */
(function setupTips() {
  let tip = null;
  const show = (el, x, y) => {
    if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; document.body.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip');
    tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2)) + 'px';
    tip.style.top = Math.max(8, y - r.height - 12) + 'px';
  };
  const hide = () => { if (tip) tip.style.display = 'none'; };
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener('mousemove', e => { const el = e.target.closest('[data-tip]'); if (el && tip && tip.style.display === 'block') show(el, e.clientX, e.clientY); });
  document.addEventListener('click', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } else hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
  window.addEventListener('scroll', hide, { passive: true });
})();

async function addPlayerSubmit(e) {
  e.preventDefault();
  if (!isOwner) return false;
  const name = document.getElementById('newPlayerName').value.trim();
  const hcp = document.getElementById('newPlayerHcp').value.trim();
  if (!name || !db) return false;
  const data = { name, createdAt: Date.now() };
  if (hcp) data.handicap = hcp;
  await db.collection('players').add(data);
  document.getElementById('newPlayerName').value = '';
  document.getElementById('newPlayerHcp').value = '';
  return false;
}

async function removePlayer(id) {
  if (!db || !isOwner) return;
  if (!confirm('Remove this player from the roster? Past scores stay in the ledger.')) return;
  await db.collection('players').doc(id).delete();
}

async function deleteTrip(tripId) {
  if (!db || !isOwner) return;
  if (!confirm('Delete this whole trip, including its rounds? This cannot be undone.')) return;
  const rounds = store.roundsByTrip[tripId] || [];
  for (const r of rounds) {
    await db.collection(`trips/${tripId}/rounds`).doc(r.id).delete();
  }
  await db.collection('trips').doc(tripId).delete();
  location.hash = '#/';
}

function editRound(tripId, roundId) {
  if (!isOwner) return;
  const round = (store.roundsByTrip[tripId] || []).find(r => r.id === roundId);
  if (!round) return;
  openRoundModal(tripId, null, round);
}

async function deleteRound(tripId, roundId) {
  if (!db || !isOwner) return;
  if (!confirm('Delete this round?')) return;
  await db.collection(`trips/${tripId}/rounds`).doc(roundId).delete();
}

/* ======================= Round modal (full scorecard entry) =======================
   presetCourse: lock the course name (adding another round to an existing course tab)
   editingRound: pass an existing round object (with .id) to edit it in place —
   the roster picker still lets you check additional players who weren't
   originally recorded, and the Course field becomes editable again. */
function openRoundModal(tripId, presetCourse, editingRound) {
  if (!isOwner) return;
  const trip = store.trips.find(t => t.id === tripId);
  if (!trip) return;
  const editing = !!editingRound;
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'roundOverlay';

  // Scope the picker to this trip's roster when one has been set; fall back
  // to the full player list for trips created before rosters existed.
  const tripRoster = trip.roster || {};
  const rosterList = Object.keys(tripRoster).length
    ? store.players.filter(p => Object.prototype.hasOwnProperty.call(tripRoster, p.id))
    : store.players;

  // Default the player picker to whoever played the trip's most recent round —
  // usually the same group, so this saves re-clicking everyone each time.
  const allRounds = store.roundsByTrip[tripId] || [];
  const lastRound = allRounds[0];
  const defaultPlayers = editing
    ? [...new Set([...Object.keys(editingRound.scores || {}), ...Object.keys(editingRound.totals || {})])]
    : (lastRound
        ? roundPlayerIds(lastRound)
        : rosterList.map(p => p.id));
  const defaultCourse = editing ? (editingRound.course || '') : (presetCourse || '');
  const courseLocked = !editing && !!presetCourse;

  // Course details start from the round being edited, or — when adding another
  // round at a course already on this trip — from the latest round there.
  const presetKey = (presetCourse || '').trim().toLowerCase();
  const priorRound = !editing && presetKey
    ? allRounds.find(r => (r.course || '').trim().toLowerCase() === presetKey)
    : null;
  const courseDefaults = editing ? editingRound : (priorRound || {});

  wrap.innerHTML = `
    <div class="modal" style="max-width:900px;">
      <h2>${editing ? `Edit round — ${escapeHtml(defaultCourse || trip.name)}` : (presetCourse ? `Add round — ${escapeHtml(presetCourse)}` : `Add a course — ${escapeHtml(trip.name)}`)}</h2>
      <div class="field" id="courseLookupField">
        <label>Look up the course <span class="tag">(fills in the details below — check them and edit anything that's off)</span></label>
        <div class="course-search-row">
          <input type="text" id="courseSearchInput" placeholder="Search course name…" value="${escapeHtml(defaultCourse)}">
          <button type="button" class="btn ghost small" onclick="searchCourseForRound()">Search</button>
        </div>
        <div id="courseSearchResults"></div>
        <div id="courseSearchStatus" class="course-search-status"></div>
        <div id="coursePickedArea"></div>
      </div>
      <div class="course-details">
        <div class="row2">
          <div class="field"><label>Course name</label>
            <input type="text" id="rCourse" value="${escapeHtml(defaultCourse)}" placeholder="Course name" ${courseLocked ? 'readonly' : ''}>
          </div>
          <div class="field"><label>Date</label>
            <input type="date" id="rDate" value="${editing ? (editingRound.date || '') : new Date().toISOString().slice(0,10)}">
          </div>
        </div>
        <div class="row4">
          <div class="field"><label>Tees</label>
            <input type="text" id="rTees" value="${escapeHtml(courseDefaults.teeName || '')}" placeholder="e.g. Blue">
          </div>
          <div class="field"><label>Yards</label>
            <input type="number" id="rYards" min="0" step="1" inputmode="numeric" value="${escapeHtml(courseDefaults.yards ?? '')}" placeholder="e.g. 6512">
          </div>
          <div class="field"><label>Slope</label>
            <input type="number" id="rSlope" min="55" max="155" step="1" inputmode="numeric" value="${escapeHtml(courseDefaults.slopeRating ?? '')}" placeholder="e.g. 128">
          </div>
          <div class="field"><label>Rating</label>
            <input type="number" id="rRating" min="50" max="85" step="0.1" inputmode="decimal" value="${escapeHtml(courseDefaults.courseRating ?? '')}" placeholder="e.g. 71.4">
          </div>
        </div>
        <div class="field">
          <label>Par by hole <span class="tag">(total <span id="rParTotal">72</span>)</span></label>
          <div id="parGridWrap"></div>
        </div>
      </div>
      <div class="field" id="scanField">
        <label>Scan scorecards <span class="tag">(optional — snap a photo of a completed card; scan again for other groups)</span></label>
        <div class="scan-controls">
          <label class="btn ghost small" for="scanFileInput" style="cursor:pointer;">📷 Scan a card</label>
          <input type="file" id="scanFileInput" accept="image/*" capture="environment" onchange="handleScorecardScan(this.files[0])">
        </div>
        <div id="scanStatus" class="course-search-status"></div>
        <div id="scanReviewArea"></div>
      </div>
      <div class="field">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <label style="margin:0;">Who played ${editing ? '<span class="tag">(check anyone new to add them)</span>' : ''}</label>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn ghost small" onclick="selectAllRoster()">Select all</button>
            <button type="button" class="btn ghost small" onclick="clearAllRoster()">Clear</button>
          </div>
        </div>
        <div class="roster-pick" id="rosterPick"></div>
      </div>
      <div id="scorecardEntryWrap" class="field"></div>
      <div class="actions">
        <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn" onclick="saveRound('${tripId}')">${editing ? 'Save changes' : 'Save round'}</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', (e) => { if (e.target === wrap) closeModal(); });

  window.__roundState = {
    par: (courseDefaults.par || DEFAULT_PAR).slice(),
    rosterList,
    players: defaultPlayers.filter(pid => rosterList.some(p => p.id === pid)),
    existingScores: editing ? (editingRound.scores || {}) : null,
    existingTotals: editing ? (editingRound.totals || {}) : null,
    editingRoundId: editing ? editingRound.id : null,
    sourceCourseId: courseDefaults.sourceCourseId || null,
    teeOptions: [],
    scanRows: [],
    pendingScanScores: {},
  };
  renderParGrid();
  renderRosterPick();
  renderScorecardEntry();

  // If we already know the course (editing, or adding another round to an
  // existing course tab), kick off a search for it automatically so the
  // tee/rating picker can appear without an extra click.
  if (defaultCourse) searchCourseForRound();
}

/* ---- course search interactions (round modal) ---- */
async function searchCourseForRound() {
  const input = document.getElementById('courseSearchInput');
  const statusEl = document.getElementById('courseSearchStatus');
  const resultsEl = document.getElementById('courseSearchResults');
  if (!input || !statusEl || !resultsEl) return;
  const q = input.value.trim();
  if (!q) return;
  resultsEl.innerHTML = '';
  statusEl.textContent = 'Searching…';
  try {
    const courses = await ogaSearchCourses(q);
    if (!courses.length) {
      statusEl.textContent = 'No matches — you can still enter the course and par by hand.';
      return;
    }
    statusEl.textContent = '';
    resultsEl.innerHTML = `<div class="course-search-results">${courses.map(c => {
      const name = escapeHtml(c.course_name || c.name || 'Unnamed course');
      const loc = escapeHtml([c.city, c.state].filter(Boolean).join(', '));
      return `<button type="button" class="csr-item" onclick="pickSearchedCourse('${jsAttr(c.id)}', '${jsAttr(c.course_name || c.name || '')}')">
        <div class="csr-name">${name}</div>
        ${loc ? `<div class="csr-loc">${loc}</div>` : ''}
      </button>`;
    }).join('')}</div>`;
  } catch (err) {
    statusEl.textContent = "Course lookup isn't reachable right now — you can still enter the course and par by hand.";
  }
}

async function pickSearchedCourse(id, name) {
  const statusEl = document.getElementById('courseSearchStatus');
  const resultsEl = document.getElementById('courseSearchResults');
  const pickedEl = document.getElementById('coursePickedArea');
  const courseInput = document.getElementById('rCourse');
  if (resultsEl) resultsEl.innerHTML = '';
  if (statusEl) statusEl.textContent = 'Loading course details…';
  if (courseInput && !courseInput.readOnly) courseInput.value = name;

  try {
    const detail = await ogaGetCourseDetail(id);
    const pars = ogaCoursePars(detail);
    const tees = Array.isArray(detail.tees) ? detail.tees.map(ogaNormalizeTee) : [];

    window.__roundState.sourceCourseId = id;
    window.__roundState.teeOptions = tees;
    if (pars) setRoundPars(pars);

    if (statusEl) statusEl.textContent = '';
    renderPickedCourseArea(name, tees);
    if (tees.length) onTeeSelected(0);
  } catch (err) {
    if (statusEl) statusEl.textContent = "Couldn't load that course's details — you can still enter par by hand.";
  }
}

function renderPickedCourseArea(name, tees) {
  const el = document.getElementById('coursePickedArea');
  if (!el) return;
  const teeOptionsHtml = tees.map((t, i) => {
    const bits = [];
    if (t.rating) bits.push(t.rating);
    if (t.slope) bits.push(`/${t.slope}`);
    const ratingStr = bits.length ? ` — ${bits.join('')}` : '';
    return `<option value="${i}">${escapeHtml(t.name)}${t.gender ? ' (' + escapeHtml(t.gender) + ')' : ''}${escapeHtml(ratingStr)}</option>`;
  }).join('');

  el.innerHTML = `
    <div class="course-picked-chip">📍 ${escapeHtml(name)} <button type="button" onclick="clearPickedCourse()" title="Clear">✕</button></div>
    ${tees.length ? `
      <div class="tee-select-row">
        <label class="tag" style="margin:0;">Tee</label>
        <select id="teeSelect" onchange="onTeeSelected(this.value)">${teeOptionsHtml}</select>
      </div>` : `<div class="course-search-status">No tee data available for this course — enter tees, yards, slope and rating below.</div>`}
  `;
}

function onTeeSelected(idx) {
  const st = window.__roundState;
  const tee = st.teeOptions[Number(idx)];
  if (!tee) return;
  // Fill the editable fields; anything the lookup doesn't have is cleared
  // so stale numbers from a different tee don't linger unnoticed.
  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v ?? ''; };
  setVal('rTees', tee.name);
  setVal('rYards', tee.yards);
  setVal('rSlope', tee.slope);
  setVal('rRating', tee.rating);
  // Prefer this tee's own per-hole par if it has a full 18; otherwise keep
  // whatever the course-level lookup already filled in.
  if (tee.holes && tee.holes.length >= 18) {
    const pars = new Array(18).fill(null);
    tee.holes.forEach(h => { if (h.number >= 1 && h.number <= 18 && h.par) pars[h.number - 1] = h.par; });
    if (pars.every(p => p)) setRoundPars(pars);
  }
}

function clearPickedCourse() {
  const st = window.__roundState;
  st.sourceCourseId = null;
  st.teeOptions = [];
  const pickedEl = document.getElementById('coursePickedArea');
  if (pickedEl) pickedEl.innerHTML = '';
}

/* ---- per-hole par editor (round modal) ----
   Two nine-hole rows so it fits a phone without sideways scrolling. Edits
   update the scorecard's par row in place, so typed scores aren't lost. */
function renderParGrid() {
  const st = window.__roundState;
  const el = document.getElementById('parGridWrap');
  if (!el) return;
  const nine = (start, label) => `
    <tr>
      <th class="pg-label">Hole</th>
      ${[...Array(9)].map((_, k) => `<th>${start + k + 1}</th>`).join('')}
      <th class="pg-sum">${label}</th>
    </tr>
    <tr>
      <td class="pg-label">Par</td>
      ${[...Array(9)].map((_, k) => {
        const i = start + k;
        return `<td><input class="course-par-in" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" maxlength="1" data-hole="${i}" value="${st.par[i]}" onfocus="this.select()" oninput="onParInput(this)" onkeydown="onParKey(event, this)" onchange="updatePar(${i}, this.value)" aria-label="Par hole ${i + 1}"></td>`;
      }).join('')}
      <td class="pg-sum" id="pgSum${label}"></td>
    </tr>`;
  el.innerHTML = `<table class="par-grid">${nine(0, 'OUT')}${nine(9, 'IN')}</table>`;
  refreshParTotals();
}

// Same quick entry as scores: pars are one digit (3–6), so each keystroke
// saves that hole and jumps to the next. Other digits are ignored.
function onParInput(el) {
  const v = el.value.replace(/[^3-6]/g, '').slice(-1);
  el.value = v;
  if (!v) return;
  updatePar(Number(el.dataset.hole), v);
  const all = [...document.querySelectorAll('input.course-par-in')];
  const next = all[all.indexOf(el) + 1];
  if (next) next.focus(); else el.blur();
}

function onParKey(e, el) {
  const all = [...document.querySelectorAll('input.course-par-in')];
  const i = all.indexOf(el);
  if (e.key === 'Enter') {
    e.preventDefault();
    if (all[i + 1]) all[i + 1].focus(); else el.blur();
  } else if (e.key === 'Backspace' && !el.value && all[i - 1]) {
    e.preventDefault();
    all[i - 1].focus();
  }
}

function setRoundPars(pars) {
  const st = window.__roundState;
  st.par = pars.slice();
  document.querySelectorAll('input.course-par-in').forEach(inp => {
    inp.value = st.par[Number(inp.dataset.hole)];
  });
  refreshParTotals();
}

function refreshParTotals() {
  const st = window.__roundState;
  const out = sumHoles(st.par, 0, 9), inn = sumHoles(st.par, 9, 18);
  const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  setText('pgSumOUT', out);
  setText('pgSumIN', inn);
  setText('rParTotal', out + inn);
  st.par.forEach((p, i) => setText(`scPar${i}`, p));
  setText('scParTot', out + inn);
}

function renderRosterPick() {
  const st = window.__roundState;
  const el = document.getElementById('rosterPick');
  if (!el) return;
  el.innerHTML = st.rosterList.map(p => `
    <label id="pick-${p.id}" class="${st.players.includes(p.id) ? 'checked' : ''}">
      <input type="checkbox" value="${p.id}" ${st.players.includes(p.id) ? 'checked' : ''} onchange="toggleRoundPlayer('${p.id}')"> ${escapeHtml(p.name)}
    </label>`).join('') || `<span class="tag">No players on this trip's roster yet — edit the trip to add some.</span>`;
}

function toggleRoundPlayer(pid) {
  const st = window.__roundState;
  const label = document.getElementById(`pick-${pid}`);
  const idx = st.players.indexOf(pid);
  captureScoreDrafts();
  if (idx === -1) { st.players.push(pid); label.classList.add('checked'); }
  else { st.players.splice(idx, 1); label.classList.remove('checked'); }
  renderScorecardEntry();
}

function selectAllRoster() {
  captureScoreDrafts();
  window.__roundState.players = window.__roundState.rosterList.map(p => p.id);
  renderRosterPick();
  renderScorecardEntry();
}

function clearAllRoster() {
  captureScoreDrafts();
  window.__roundState.players = [];
  renderRosterPick();
  renderScorecardEntry();
}

function renderScorecardEntry() {
  const st = window.__roundState;
  const holderEl = document.getElementById('scorecardEntryWrap');
  if (!holderEl) return;
  if (st.players.length === 0) {
    holderEl.innerHTML = `<p class="tag">Select who played to enter scores.</p>`;
    return;
  }
  const parRow = `<tr>
      <td class="rowlabel">Par</td>
      ${st.par.map((p, i) => `<td class="holecell" id="scPar${i}">${p}</td>`).join('')}
      <td class="sum" id="scParTot">${sumHoles(st.par,0,18)}</td>
    </tr>`;
  const headerRow = `<tr><th class="rowlabel">Hole</th>${st.par.map((p,i)=>`<th class="holecell">${i+1}</th>`).join('')}<th class="sum">TOT</th></tr>`;
  // Inputs are plain text with a numeric keypad (not type=number) so we can
  // read each keystroke and jump to the next hole automatically.
  const numAttrs = 'type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next"';
  const bodyRows = st.players.map(pid => {
    const existing = (st.draftScores && st.draftScores[pid])
      || (st.pendingScanScores && st.pendingScanScores[pid])
      || (st.existingScores && st.existingScores[pid]);
    const total = (st.draftTotals && st.draftTotals[pid]) || (st.existingTotals && st.existingTotals[pid]) || '';
    const cells = st.par.map((p, i) => {
      const v = existing && Number(existing[i]) > 0 ? existing[i] : '';
      return `<td><input class="score-in" ${numAttrs} maxlength="2" data-pid="${pid}" data-hole="${i}" value="${v}" onfocus="this.select()" oninput="onScoreInput(this)" onkeydown="onScoreKey(event, this)" aria-label="${escapeHtml(playerName(pid))} hole ${i + 1}"></td>`;
    }).join('');
    return `<tr>
      <td class="rowlabel">${escapeHtml(playerName(pid))}</td>
      ${cells}
      <td class="sum"><input class="total-in" ${numAttrs} maxlength="3" id="tot-${pid}" data-pid="${pid}" value="${escapeHtml(total)}" placeholder="–" onfocus="this.select()" oninput="this.value = this.value.replace(/\\D/g, '')" aria-label="${escapeHtml(playerName(pid))} total"></td>
    </tr>`;
  }).join('');

  holderEl.innerHTML = `
    <label>Scorecard</label>
    <p class="tag score-tip">Type a score and it jumps to the next hole. Only have a total? Leave the holes blank and type it in TOT.</p>
    <div class="scorecard-wrap">
      <table class="scorecard">
        ${headerRow}
        ${parRow}
        ${bodyRows}
      </table>
    </div>
  `;
  st.players.forEach(pid => updateScoreTotal(pid));
}

function updatePar(holeIdx, val) {
  const n = Math.round(Number(val));
  // Anything outside 3–6 (or a cleared box) keeps the hole's previous par.
  if (n >= 3 && n <= 6) window.__roundState.par[holeIdx] = n;
  const inp = document.querySelector(`input.course-par-in[data-hole="${holeIdx}"]`);
  if (inp) inp.value = window.__roundState.par[holeIdx];
  refreshParTotals();
}

/* TOT is computed (and locked) once any hole has a score; with every hole
   blank it's an editable box for a total-only score. */
function updateScoreTotal(pid) {
  const inputs = document.querySelectorAll(`input.score-in[data-pid="${pid}"]`);
  let total = 0, any = false;
  inputs.forEach(inp => { const v = Number(inp.value); if (v > 0) { total += v; any = true; } });
  const totIn = document.getElementById(`tot-${pid}`);
  if (!totIn) return;
  if (any) {
    totIn.value = total;
    totIn.readOnly = true;
    totIn.dataset.computed = '1';
  } else {
    if (totIn.dataset.computed) totIn.value = '';
    totIn.readOnly = false;
    delete totIn.dataset.computed;
  }
}

// Scores of 2–9 are complete after one digit; a leading 1 waits for a
// second digit (10–12). For a hole-in-one, just tap the next hole.
function onScoreInput(el) {
  const v = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 2);
  el.value = v;
  updateScoreTotal(el.dataset.pid);
  if ((v.length === 1 && v !== '1') || v.length === 2) focusNextScore(el);
}

function onScoreKey(e, el) {
  if (e.key === 'Enter') { e.preventDefault(); focusNextScore(el); }
  else if (e.key === 'Backspace' && !el.value) {
    // Backspace on an empty cell steps back to fix the previous hole.
    const all = [...document.querySelectorAll('input.score-in')];
    const prev = all[all.indexOf(el) - 1];
    if (prev) { e.preventDefault(); prev.focus(); }
  }
}

// Moves across a player's row, then on to the next player's hole 1.
function focusNextScore(el) {
  const all = [...document.querySelectorAll('input.score-in')];
  const next = all[all.indexOf(el) + 1];
  if (next) {
    next.focus();
    next.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  } else {
    el.blur();
  }
}

// Remember what's been typed so re-drawing the grid (adding or removing a
// player) doesn't wipe it.
function captureScoreDrafts() {
  const st = window.__roundState;
  if (!st) return;
  st.draftScores = st.draftScores || {};
  st.draftTotals = st.draftTotals || {};
  st.players.forEach(pid => {
    const inputs = document.querySelectorAll(`input.score-in[data-pid="${pid}"]`);
    if (!inputs.length) return;
    st.draftScores[pid] = [...inputs].map(inp => Number(inp.value) || 0);
    const totIn = document.getElementById(`tot-${pid}`);
    st.draftTotals[pid] = totIn && !totIn.dataset.computed ? totIn.value : '';
  });
}

/* ======================= Scorecard scanning (free, client-side OCR) =======================
   Uses Tesseract.js, loaded on demand, entirely in the browser — no account,
   no API key, no cost, and the photo never leaves the device. Handwriting
   accuracy is limited, so every detected row stays fully editable and
   nothing is added to the scorecard until the owner assigns and confirms it. */
let __tesseractLoadPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (__tesseractLoadPromise) return __tesseractLoadPromise;
  __tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load OCR library'));
    document.head.appendChild(s);
  });
  return __tesseractLoadPromise;
}

// Heuristic parse: a line with a run of plausible stroke counts (1–15) is
// treated as a candidate player row. This can't reliably tell a real score
// row from a printed par row or a phone number, so results are capped and
// always shown for review/removal rather than applied automatically.
function parseScorecardText(text) {
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const candidates = lines
    .map(line => {
      const matches = line.match(/\b([1-9]|1[0-5])\b/g);
      return { numbers: matches ? matches.map(Number) : [] };
    })
    .filter(c => c.numbers.length >= 6);
  candidates.sort((a, b) => b.numbers.length - a.numbers.length);
  return candidates.slice(0, 6).map(c => {
    const scores = new Array(18).fill(null);
    c.numbers.slice(0, 18).forEach((n, i) => { scores[i] = n; });
    return { scores, assignedPid: '' };
  });
}

async function handleScorecardScan(file) {
  if (!file) return;
  const statusEl = document.getElementById('scanStatus');
  if (statusEl) statusEl.textContent = 'Loading text recognition… (first scan takes a bit longer)';
  try {
    await loadTesseract();
    if (statusEl) statusEl.textContent = 'Reading the scorecard…';
    const worker = await Tesseract.createWorker('eng');
    const { data } = await worker.recognize(file);
    await worker.terminate();
    const rows = parseScorecardText(data.text);
    if (!rows.length) {
      statusEl.textContent = "Couldn't make out a clear row of scores in that photo — try a clearer, well-lit shot, or enter scores by hand.";
    } else {
      statusEl.textContent = `Found ${rows.length} possible row${rows.length === 1 ? '' : 's'} — assign each to a player and fix any misreads below.`;
      window.__roundState.scanRows = (window.__roundState.scanRows || []).concat(rows);
      renderScanReview();
    }
  } catch (err) {
    if (statusEl) statusEl.textContent = "Scanning didn't work on this device/browser — you can still enter scores by hand.";
  }
  const input = document.getElementById('scanFileInput');
  if (input) input.value = '';
}

function renderScanReview() {
  const st = window.__roundState;
  const el = document.getElementById('scanReviewArea');
  if (!el) return;
  if (!st.scanRows || !st.scanRows.length) { el.innerHTML = ''; return; }

  const headerRow = `<tr><th class="rowlabel">Assign to</th>${st.par.map((p, i) => `<th class="holecell">${i + 1}</th>`).join('')}<th></th></tr>`;
  const bodyRows = st.scanRows.map((row, idx) => {
    const options = st.rosterList.map(p =>
      `<option value="${p.id}" ${row.assignedPid === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
    ).join('');
    const cells = row.scores.map((v, i) =>
      `<td><input class="scan-score-in" type="number" min="1" max="15" data-row="${idx}" data-hole="${i}" value="${v ?? ''}" oninput="updateScanRowValue(${idx}, ${i}, this.value)"></td>`
    ).join('');
    return `<tr>
      <td class="rowlabel">
        <select onchange="assignScanRow(${idx}, this.value)">
          <option value="">— choose player —</option>
          ${options}
        </select>
      </td>
      ${cells}
      <td><button type="button" class="btn small ghost" onclick="removeScanRow(${idx})" title="Remove this scanned row">✕</button></td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="scorecard-wrap" style="margin-top:10px;">
      <table class="scorecard">${headerRow}${bodyRows}</table>
    </div>
    <div class="toolbar" style="margin-top:8px;">
      <button type="button" class="btn small" onclick="applyScanRows()">Add assigned rows to scorecard</button>
    </div>
  `;
}

function assignScanRow(idx, pid) {
  const st = window.__roundState;
  if (!st.scanRows[idx]) return;
  st.scanRows[idx].assignedPid = pid;
}

function updateScanRowValue(idx, holeIdx, val) {
  const st = window.__roundState;
  if (!st.scanRows[idx]) return;
  st.scanRows[idx].scores[holeIdx] = Number(val) || null;
}

function removeScanRow(idx) {
  const st = window.__roundState;
  st.scanRows.splice(idx, 1);
  renderScanReview();
}

function applyScanRows() {
  const st = window.__roundState;
  const statusEl = document.getElementById('scanStatus');
  const remaining = [];
  let appliedCount = 0;
  captureScoreDrafts();
  st.scanRows.forEach(row => {
    if (!row.assignedPid) { remaining.push(row); return; }
    st.pendingScanScores[row.assignedPid] = row.scores.map(v => Number(v) || 0);
    delete st.draftScores[row.assignedPid];
    delete st.draftTotals[row.assignedPid];
    if (!st.players.includes(row.assignedPid)) st.players.push(row.assignedPid);
    appliedCount++;
  });
  st.scanRows = remaining;
  if (statusEl) {
    statusEl.textContent = appliedCount
      ? `Added ${appliedCount} scanned row${appliedCount === 1 ? '' : 's'} to the scorecard below — double-check the numbers.`
      : 'Choose a player for each row before adding it to the scorecard.';
  }
  renderRosterPick();
  renderScorecardEntry();
  renderScanReview();
}

async function saveRound(tripId) {
  if (!db || !isOwner) { closeModal(); return; }
  const st = window.__roundState;
  if (!st.players.length) { alert('Select at least one player.'); return; }
  const scores = {};
  const totals = {};
  st.players.forEach(pid => {
    const holes = [];
    for (let i = 0; i < 18; i++) {
      const inp = document.querySelector(`input.score-in[data-pid="${pid}"][data-hole="${i}"]`);
      holes.push(inp ? (Number(inp.value) || 0) : 0);
    }
    scores[pid] = holes;
    // Total-only score: kept only when no holes were entered for this player.
    const totIn = document.getElementById(`tot-${pid}`);
    const total = totIn ? Number(totIn.value) : 0;
    if (!hasHoleScores(holes) && total > 0) totals[pid] = total;
  });
  const data = {
    course: document.getElementById('rCourse').value.trim(),
    date: document.getElementById('rDate').value || new Date().toISOString().slice(0,10),
    par: st.par,
    scores,
    totals,
  };
  // Course details come straight from the editable fields. A field left blank
  // while editing removes any value saved before, rather than keeping it.
  const remove = st.editingRoundId ? firebase.firestore.FieldValue.delete() : undefined;
  const num = id => {
    const v = parseFloat(document.getElementById(id).value);
    return Number.isFinite(v) && v > 0 ? v : null;
  };
  const details = {
    teeName: document.getElementById('rTees').value.trim() || null,
    yards: num('rYards') && Math.round(num('rYards')),
    slopeRating: num('rSlope') && Math.round(num('rSlope')),
    courseRating: num('rRating'),
    sourceCourseId: st.sourceCourseId,
  };
  Object.entries(details).forEach(([k, v]) => {
    if (v) data[k] = v;
    else if (remove) data[k] = remove;
  });

  let roundId = st.editingRoundId;
  if (roundId) {
    await db.collection(`trips/${tripId}/rounds`).doc(roundId).update(data);
  } else {
    data.createdAt = Date.now();
    const ref = await db.collection(`trips/${tripId}/rounds`).add(data);
    roundId = ref.id;
  }
  closeModal();
  watchRounds(tripId);
  const courseKey = (data.course || (store.trips.find(t => t.id === tripId)?.course) || 'Unspecified course').trim().toLowerCase() || 'unspecified course';
  location.hash = `#/trip/${tripId}/${encodeURIComponent(courseKey)}/${roundId}`;
}

function closeModal() {
  const ov = document.querySelector('.overlay');
  if (ov) ov.remove();
  window.__roundState = null;
}

/* ======================= Boot ======================= */
initDb();
render();
</script>
